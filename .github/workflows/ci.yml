name: CI

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Required status check names: `checks`, `compile (pinned)`, `compile (minimum)`. Do not rename casually.
  checks:
    name: checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Same volume names as .devcontainer/devcontainer.json, backed by host dirs that actions/cache can save.
      - name: Prepare cache volumes
        run: |
          mkdir -p "$RUNNER_TEMP/gp-cache" "$RUNNER_TEMP/gp-platformio"
          docker volume create --driver local --opt type=none --opt o=bind \
            --opt device="$RUNNER_TEMP/gp-cache" garden-pilot-cache
          docker volume create --driver local --opt type=none --opt o=bind \
            --opt device="$RUNNER_TEMP/gp-platformio" garden-pilot-platformio

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/gp-cache/uv
          key: gp-uv-v1-${{ runner.os }}-${{ hashFiles('uv.lock') }}

      - name: Lint and test in the devcontainer
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          imageName: garden-pilot-devcontainer
          push: never
          # If Docker on the runner rejects the committed runArgs, set the host env vars read by
          # devcontainer.json (GP_SERIAL_DEVICE, GP_SERIAL_GROUP) on this step instead of editing it.
          runCmd: script/lint && script/test && uv cache prune --ci
          env: |
            GP_SECRETS=example

  compile:
    name: compile (${{ matrix.target }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Labels, not versions: the version behind each label comes from script/_esphome.
        target: [pinned, minimum]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare cache volumes
        run: |
          mkdir -p "$RUNNER_TEMP/gp-cache" "$RUNNER_TEMP/gp-platformio"
          docker volume create --driver local --opt type=none --opt o=bind \
            --opt device="$RUNNER_TEMP/gp-cache" garden-pilot-cache
          docker volume create --driver local --opt type=none --opt o=bind \
            --opt device="$RUNNER_TEMP/gp-platformio" garden-pilot-platformio

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ runner.temp }}/gp-cache/uv
            ${{ runner.temp }}/gp-cache/esphome
            ${{ runner.temp }}/gp-platformio
          key: gp-toolchain-v1-${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}

      - name: Compile firmware in the devcontainer
        uses: devcontainers/ci@513af61f4de4f75d37e4438f184ba4358f0fc1ca # v0.3.1900000450
        with:
          imageName: garden-pilot-devcontainer
          push: never
          runCmd: script/compile && uv cache prune --ci
          env: |
            GP_SECRETS=example
            GP_ESPHOME=${{ matrix.target }}
