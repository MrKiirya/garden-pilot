version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
    cooldown:
      default-days: 7
      semver-patch-days: 3
    groups:
      # esphome is not grouped: it gets its own PR.
      python-dev-tools:
        patterns: [pytest, pyyaml, yamllint]

  - package-ecosystem: docker
    directory: "/.devcontainer"
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
    groups:
      devcontainer-images:
        patterns: ["*"]
