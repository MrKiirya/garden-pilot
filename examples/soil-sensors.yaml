# Example 3: three beds with a soil moisture probe each (ADC pins adc_1..adc_3 of the board profile). A run of a bed
# is skipped when its soil is wetter than skip_above (60 %); a missing or stale (older than 30 min) reading waters as
# scheduled. bed_soil_skip.yaml replaces bed.yaml for these beds. Calibrate each probe: cal_dry_v is the voltage in air,
# cal_wet_v in water (the values here are examples). The greenhouse-wide probe (gh_sensors_soil) is left out: it
# would share adc_1 with bed 1.
#
# Copy secrets.example.yaml to examples/secrets.yaml (git-ignored) and fill in your values, then:
#   uv run esphome run examples/soil-sensors.yaml
# `!include` paths here start with ../ because they resolve relative to this file. gp_root: ".." tells the
# packages where the repository root (components/, the screensaver font) is. See examples/README.md.
#
# Active-low relay modules are NOT supported: they energise while the ESP32 resets. Use a high-level-trigger module
# (or set its jumper to H). This example needs the analog pins adc_1..adc_3, which the LilyGO profile does not define:
# keep the breadboard profile.

substitutions:
  api_encryption_key: !secret api_encryption_key
  ota_password: !secret ota_password
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  wifi_ap_password: !secret wifi_ap_password
  # Path from this file to the repository root: the packages find components/ and the font through it.
  gp_root: ".."

esphome:
  name: gp-soil-sensors
  friendly_name: GardenPilot soil sensors

logger:
  level: INFO

packages:
  # Board profile: pins, display/touch orientation and calibration. Pick exactly one.
  hardware: !include ../hardware/esp32-s3-devkitc1-breadboard.yaml

  # Core: connectivity and clock.
  core_api: !include ../packages/core/api.yaml
  core_ota: !include ../packages/core/ota.yaml
  core_network: !include ../packages/core/network.yaml
  core_time: !include ../packages/core/time.yaml
  core_diagnostics: !include ../packages/core/diagnostics.yaml

  # Display + touch, then LVGL: base first, boot screen first among the pages.
  display_touch: !include ../packages/display_touch.yaml
  lvgl_base: !include ../packages/lvgl/base.yaml
  lvgl_page_boot: !include ../packages/lvgl/page_boot.yaml
  lvgl_page_home: !include ../packages/lvgl/page_home.yaml
  lvgl_page_touch_test: !include ../packages/lvgl/page_touch_test.yaml
  lvgl_page_lawn: !include ../packages/lvgl/page_lawn.yaml
  lvgl_page_schedules: !include ../packages/lvgl/page_schedules.yaml
  lvgl_dialog_confirm: !include ../packages/lvgl/dialog_confirm.yaml
  lvgl_screensaver: !include ../packages/lvgl/screensaver.yaml
  lvgl_page_setup: !include ../packages/lvgl/page_setup.yaml
  lvgl_page_network: !include ../packages/lvgl/page_network.yaml
  lvgl_network_wifi: !include ../packages/lvgl/network_wifi_status.yaml
  lvgl_boot_wifi: !include ../packages/lvgl/boot_wifi.yaml

  # Irrigation group, then the beds in zone order, then the gp_* layer (screens and Home Assistant use it only).
  gh_irrigation: !include ../packages/greenhouse/irrigation.yaml
  gh_bed_1: !include
    file: ../packages/greenhouse/bed_soil_skip.yaml
    vars: {bed: "1", bed_name: "Greenhouse bed 1", relay: "1", skip_above: "60"}
  gh_bed_1_soil: !include
    file: ../packages/greenhouse/bed_soil.yaml
    vars: {bed: "1", bed_name: "Greenhouse bed 1", adc_pin: "${adc_1_pin}", cal_dry_v: "3.16", cal_wet_v: "0.80"}
  gh_bed_2: !include
    file: ../packages/greenhouse/bed_soil_skip.yaml
    vars: {bed: "2", bed_name: "Greenhouse bed 2", relay: "2", skip_above: "60"}
  gh_bed_2_soil: !include
    file: ../packages/greenhouse/bed_soil.yaml
    vars: {bed: "2", bed_name: "Greenhouse bed 2", adc_pin: "${adc_2_pin}", cal_dry_v: "3.16", cal_wet_v: "0.80"}
  gh_bed_3: !include
    file: ../packages/greenhouse/bed_soil_skip.yaml
    vars: {bed: "3", bed_name: "Greenhouse bed 3", relay: "3", skip_above: "60"}
  gh_bed_3_soil: !include
    file: ../packages/greenhouse/bed_soil.yaml
    vars: {bed: "3", bed_name: "Greenhouse bed 3", adc_pin: "${adc_3_pin}", cal_dry_v: "3.16", cal_wet_v: "0.80"}

  core_gp: !include ../packages/core/gp.yaml
  core_gp_api: !include ../packages/core/gp_api.yaml
  gh_gp: !include ../packages/greenhouse/gp.yaml
  gh_lvgl_page: !include ../packages/greenhouse/lvgl_page.yaml
  gh_lvgl_history: !include ../packages/greenhouse/lvgl_history.yaml
  # No air / soil sensors in this example, so no gh_screensaver_status either (its status line reads their ids). To add
  # them: gh_sensors_air (+ gh_sensors_soil on adc_1) and gh_screensaver_status, see garden-pilot.yaml.
  gh_gp_lvgl: !include ../packages/greenhouse/gp_lvgl_status.yaml
  gh_valve_test: !include ../packages/greenhouse/lvgl_valve_test.yaml

  # Device-side watering schedule: a hub and one slot (slots are off until switched on in Home Assistant).
  gh_schedule: !include ../packages/greenhouse/schedule.yaml
  gh_schedule_slot_1: !include
    file: ../packages/greenhouse/schedule_slot.yaml
    vars: {slot: "1", start: "06:00:00"}
  # Schedules page rows (WATER tab) and the Home "next" label; needs lvgl_page_schedules and gh_schedule.
  gh_lvgl_schedules: !include ../packages/greenhouse/lvgl_schedules.yaml
