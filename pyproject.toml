[project]
name = "garden-pilot"
version = "0.0.0"
description = "ESPHome irrigation and bed-heating controller with an LVGL touch UI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.15"
dependencies = []

[dependency-groups]
# Installed by a plain `uv sync`. ESPHome is pinned exactly: the same version runs locally,
# in the devcontainer and in CI. Bump it in a dedicated `chore(deps):` PR (see CLAUDE.md).
dev = [
    "esphome==2026.9.1",
    "pytest>=8",
    "pyyaml>=6",
    "yamllint>=1.35",
]

[tool.garden-pilot]
# Lowest ESPHome release this configuration supports (SPEC §6). CI compiles it.
esphome-minimum = "2026.6.3"

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "--strict-config"]
markers = [
    "unit: fast checks that need no ESPHome toolchain",
    "config: runs `esphome config` on the device configuration",
    "cpp: builds and runs the C++ unit tests with the host compiler",
    "host: compiles a test config for the host platform and runs it",
]
