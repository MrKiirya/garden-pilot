# ESPHome: device entrypoint. Split shared pieces into packages/ when the config grows.

esphome:
  name: my-sprinkler
  friendly_name: My Sprinkler

esp32:
  board: esp32-s3-devkitc1-n16r8
  framework:
    type: esp-idf

logger:
  level: INFO

packages:
  network: !include packages/network.yaml
  display_touch: !include packages/display_touch.yaml
  # LVGL: base first, then pages (order matters for default page = first merged page).
  lvgl_base: !include packages/lvgl/base.yaml
  lvgl_page_touch_test: !include packages/lvgl/page_touch_test.yaml
  lvgl_page_app_shell: !include packages/lvgl/page_app_shell.yaml
  # Optional: touch dot / coord updates on press. Comment out to disable (overlay script stays no-op).
  touch_dot_test: !include packages/touch_dot_test.yaml
