# ESPHome: device entrypoint. Split shared pieces into packages/ when the config grows.

esphome:
  name: my-sprinkler
  friendly_name: My Sprinkler

esp32:
  board: esp32-s3-devkitc1-n16r8
  framework:
    type: esp-idf

logger:
  level: INFO

# Home Assistant / ESPHome Dashboard connection.
api:
  encryption:
    key: !secret api_encryption_key

# Wireless firmware updates.
ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2

  # Fallback AP + captive portal if WiFi fails (password in secrets).
  ap:
    ssid: "My-Sprinkler"
    password: !secret wifi_ap_password

captive_portal:
