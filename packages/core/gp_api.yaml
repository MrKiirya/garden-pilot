# Home Assistant actions of the gp_* layer: ONE generic set for every group (a new module adds no actions).
#   group    the group key (the greenhouse is "greenhouse", see packages/greenhouse/gp.yaml)
#   zone     1-based, as on the screen and in the entity names ("Greenhouse bed 2" = zone 2)
#   minutes  0 = the zone's configured run duration; more than the zone's maximum (its run-duration number max) is
#            cut to the maximum with a WARN (and anything above 24 h to 24 h, gp::api_seconds)
# Each body is one gp.* action. Needs core_api and core_gp. Home Assistant calls them as `esphome.<node>_gp_run_zone`,
# so automations that start watering use these instead of the zone switches.

api:
  actions:
    - action: gp_run_zone
      variables:
        group: string
        zone: int
        minutes: int
      then:
        - gp.run_zone:
            hub: gp_hub
            group: !lambda "return group;"
            zone: !lambda "return zone - 1;"
            duration: !lambda "return gp::api_seconds(minutes);"
            source: ha
    - action: gp_enqueue_zone
      variables:
        group: string
        zone: int
        minutes: int
      then:
        - gp.enqueue_zone:
            hub: gp_hub
            group: !lambda "return group;"
            zone: !lambda "return zone - 1;"
            duration: !lambda "return gp::api_seconds(minutes);"
            source: ha
    - action: gp_start_queue
      variables:
        group: string
      then:
        - gp.start_queue:
            hub: gp_hub
            group: !lambda "return group;"
    - action: gp_full_cycle
      variables:
        group: string
      then:
        - gp.full_cycle:
            hub: gp_hub
            group: !lambda "return group;"
            source: ha
    - action: gp_stop_all
      variables:
        group: string
      then:
        - gp.stop_all:
            hub: gp_hub
            group: !lambda "return group;"
    - action: gp_reset_watchdog
      variables:
        group: string
      then:
        - gp.reset_watchdog:
            hub: gp_hub
            group: !lambda "return group;"
