# Wall clock from the PC (ESPHome `host` platform), for the emulator; the device uses packages/core/time.yaml.
# The id stays `ha_time` so packages/lvgl/base.yaml (the header clock) works with either source.
# `on_time_sync` does not fire on host; the header clocks refresh from the 2 s poller in packages/lvgl/base.yaml.
# Keep in sync with time.yaml (same id, one item).

time:
  - platform: host
    id: ha_time
