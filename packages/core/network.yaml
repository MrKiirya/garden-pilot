# Wi-Fi with a fallback access point and captive portal (device only; the PC emulator uses the host's network).
# No secrets in this file: the entry file assigns the substitutions below from its own secrets (none has a default
# on purpose, so a missing value fails validation).
#   wifi_ssid, wifi_password, wifi_ap_password
# The API and OTA live in packages/core/api.yaml and ota.yaml.

wifi:
  ssid: ${wifi_ssid}
  password: ${wifi_password}
  min_auth_mode: WPA2

  # Fallback AP when station WiFi fails.
  ap:
    ssid: "GardenPilot-AP"
    password: ${wifi_ap_password}

captive_portal:
