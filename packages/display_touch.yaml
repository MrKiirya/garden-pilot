# SPI + ILI9341 (mipi_spi) + XPT2046. UI: packages/lvgl/; optional touch overlay: touch_dot_test.yaml.
# Pins, display orientation and touch calibration come from the board profile (hardware/).

spi:
  - id: tft_spi
    clk_pin: ${spi_clk_pin}
    mosi_pin: ${spi_mosi_pin}
    miso_pin: ${spi_miso_pin}

display:
  - platform: mipi_spi
    id: tft_display
    model: ILI9341
    spi_id: tft_spi
    cs_pin: ${display_cs_pin}
    dc_pin: ${display_dc_pin}
    reset_pin: ${display_reset_pin}
    invert_colors: false
    data_rate: 40MHz
    dimensions:
      width: 320
      height: 240
    transform:
      swap_xy: ${display_swap_xy}
      mirror_x: ${display_mirror_x}
      mirror_y: ${display_mirror_y}

touchscreen:
  - platform: xpt2046
    id: touch
    spi_id: tft_spi
    cs_pin: ${touch_cs_pin}
    interrupt_pin: ${touch_irq_pin}
    calibration:
      x_min: ${touch_cal_x_min}
      x_max: ${touch_cal_x_max}
      y_min: ${touch_cal_y_min}
      y_max: ${touch_cal_y_max}
    transform:
      mirror_x: ${touch_mirror_x}
      mirror_y: ${touch_mirror_y}
      swap_xy: ${touch_swap_xy}
    on_touch:
      then:
        - lambda: |-
            // TouchPoint here is current for this event; get_touch() in a script is often empty by then.
            ESP_LOGI("touch_dot", "tap xy=%u,%u raw=%d,%d z_raw=%d state=%d",
                     (unsigned) touch.x, (unsigned) touch.y, (int) touch.x_raw, (int) touch.y_raw,
                     (int) touch.z_raw, (int) touch.state);
        - script.execute: touch_ui

script:
  - id: touch_ui
    then:
      - script.execute: touch_dot_overlay

  # Default no-op when touch_dot_test package is not included.
  - id: touch_dot_overlay
    then:
      - delay: 0ms
