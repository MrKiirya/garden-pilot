# PC emulator only (garden-pilot-sim.yaml); never include from the device entry file.
# SIM board: the virtual board. Left card: one live indicator per board relay (named by board function, state is the
# fill colour plus the word ON/OFF) and the "Sim auto drift" switch. Right card: one slider per simulated value
# (they write the settable numbers from sensors.yaml / bed_soil.yaml; the same numbers can be set by script/sim-ctl or
# Home Assistant). A sim-only SIM button on the top layer (visible on every page, in the header band) opens the page.
# To drop the page: comment out sim_page_board (and sim_sensors_lvgl if you also drop the Home/Greenhouse values).
# Note: the SIM button is on the top layer of every page, so on the Touch test page it catches taps in
# x=200..244, y=1..21 (ESPHome has no page condition to hide it; page entries do not merge): read touch-test
# results near the top edge with that in mind.
# Tokens only (design/tokens.json). The Slider and the relay indicator row are not in the design system yet.
# The sync interval reads state by polling: there is no lvgl.* call in any number/switch on_value (LVGL may not be
# ready then). Sliders and the switch write with on_change, which fires on user input only, so the poll never
# fights the knob.

