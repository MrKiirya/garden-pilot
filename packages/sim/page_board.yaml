interval:
  - interval: 500ms
    then:
      - if:
          condition:
            switch.is_on: board_relay_1
          then:
            - lvgl.widget.update:
                id: sim_relay_1_led
                bg_color: 0x4caf50
            - lvgl.label.update:
                id: sim_relay_1_state
                text: "ON"
                text_color: 0x78dc77
          else:
            - lvgl.widget.update:
                id: sim_relay_1_led
                bg_color: 0x353534
            - lvgl.label.update:
                id: sim_relay_1_state
                text: "OFF"
                text_color: 0xbecab9
      - if:
          condition:
            switch.is_on: board_relay_2
          then:
            - lvgl.widget.update:
                id: sim_relay_2_led
                bg_color: 0x4caf50
            - lvgl.label.update:
                id: sim_relay_2_state
                text: "ON"
                text_color: 0x78dc77
          else:
            - lvgl.widget.update:
                id: sim_relay_2_led
                bg_color: 0x353534
            - lvgl.label.update:
                id: sim_relay_2_state
                text: "OFF"
                text_color: 0xbecab9
      - if:
          condition:
            switch.is_on: board_relay_3
          then:
            - lvgl.widget.update:
                id: sim_relay_3_led
                bg_color: 0x4caf50
            - lvgl.label.update:
                id: sim_relay_3_state
                text: "ON"
                text_color: 0x78dc77
          else:
            - lvgl.widget.update:
                id: sim_relay_3_led
                bg_color: 0x353534
            - lvgl.label.update:
                id: sim_relay_3_state
                text: "OFF"
                text_color: 0xbecab9
      - if:
          condition:
            switch.is_on: sim_auto_drift
          then:
            - lvgl.widget.update:
                id: sim_auto_drift_sw
                state:
                  checked: true
            - lvgl.label.update:
                id: sim_auto_drift_state
                text: "ON"
                text_color: 0x78dc77
          else:
            - lvgl.widget.update:
                id: sim_auto_drift_sw
                state:
                  checked: false
            - lvgl.label.update:
                id: sim_auto_drift_state
                text: "OFF"
                text_color: 0xbecab9
      - if:
          condition:
            lambda: return id(sim_air_temperature).has_state();
          then:
            - lvgl.slider.update:
                id: sim_air_t_slider
                value: !lambda return (int) lroundf(id(sim_air_temperature).state);
            - lvgl.label.update:
                id: sim_air_t_value
                text: !lambda |-
                  char buf[12];
                  snprintf(buf, sizeof(buf), "%.0fC", id(sim_air_temperature).state);
                  return std::string(buf);
      - if:
          condition:
            lambda: return id(sim_air_humidity).has_state();
          then:
            - lvgl.slider.update:
                id: sim_air_rh_slider
                value: !lambda return (int) lroundf(id(sim_air_humidity).state);
            - lvgl.label.update:
                id: sim_air_rh_value
                text: !lambda |-
                  char buf[12];
                  snprintf(buf, sizeof(buf), "%.0f%%", id(sim_air_humidity).state);
                  return std::string(buf);
      - if:
          condition:
            lambda: return id(sim_soil_moisture).has_state();
          then:
            - lvgl.slider.update:
                id: sim_soil_gh_slider
                value: !lambda return (int) lroundf(id(sim_soil_moisture).state);
            - lvgl.label.update:
                id: sim_soil_gh_value
                text: !lambda |-
                  char buf[12];
                  snprintf(buf, sizeof(buf), "%.0f%%", id(sim_soil_moisture).state);
                  return std::string(buf);
      - if:
          condition:
            lambda: return id(sim_bed1_soil_moisture).has_state();
          then:
            - lvgl.slider.update:
                id: sim_soil_b1_slider
                value: !lambda return (int) lroundf(id(sim_bed1_soil_moisture).state);
            - lvgl.label.update:
                id: sim_soil_b1_value
                text: !lambda |-
                  char buf[12];
                  snprintf(buf, sizeof(buf), "%.0f%%", id(sim_bed1_soil_moisture).state);
                  return std::string(buf);
      - if:
          condition:
            lambda: return id(sim_bed2_soil_moisture).has_state();
          then:
            - lvgl.slider.update:
                id: sim_soil_b2_slider
                value: !lambda return (int) lroundf(id(sim_bed2_soil_moisture).state);
            - lvgl.label.update:
                id: sim_soil_b2_value
                text: !lambda |-
                  char buf[12];
                  snprintf(buf, sizeof(buf), "%.0f%%", id(sim_bed2_soil_moisture).state);
                  return std::string(buf);
      - if:
          condition:
            lambda: return id(sim_bed3_soil_moisture).has_state();
          then:
            - lvgl.slider.update:
                id: sim_soil_b3_slider
                value: !lambda return (int) lroundf(id(sim_bed3_soil_moisture).state);
            - lvgl.label.update:
                id: sim_soil_b3_value
                text: !lambda |-
                  char buf[12];
                  snprintf(buf, sizeof(buf), "%.0f%%", id(sim_bed3_soil_moisture).state);
