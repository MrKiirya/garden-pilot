# Greenhouse summary strip on the shared home page (extends home_page).

lvgl:
  pages:
    - id: !extend home_page
      widgets:
        - label:
            x: 10
            y: 70
            text: "Greenhouse"
        - label:
            id: gh_home_air_t_label
            x: 10
            y: 88
            text: "GH T: --"
        - label:
            id: gh_home_air_rh_label
            x: 120
            y: 88
            text: "GH RH: --"
        - label:
            id: gh_home_irr_status
            x: 10
            y: 106
            text: "GH irr: idle"
