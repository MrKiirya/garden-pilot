# Valve test and service mode (draft D18; task 010). ACTUATOR-FACING: a TEST button opens one real valve.
# Opened from Setup > SERVICE. Greenhouse-specific (group gp_greenhouse); rows for beds 1-3 only, like the greenhouse
# page, until stage 9. Everything goes through the gp_* layer (gp.run_zone / gp.stop_all and the read model); the
# engine behind it is not named here.
#
# SAFETY (human's call to change):
# - `valve_test_max_time` is the longest a test valve stays open. It MUST NOT exceed 10 s (tests/test_service.py).
#   It is enforced twice: `duration` of gp.run_zone and the independent `gp_valve_test_guard` script that stops
#   everything after the same time (holds even if the duration were ignored).
# - Timing: the guard counts from the tap, but the lane opens the valve about 2 s later (switching delay after
#   the shutdown; measured again in the emulator for task 014), so a test valve is really open about 8 s and the
#   "OPEN - N s" countdown stops near 2 s.
# - One valve at a time: every start stops the group first.
# - Service mode (`gp_service_mode`, not restored: a reboot always leaves it) is on while the page is open. On entry
#   everything is stopped and the queue cleared. A 1 s poller stops any run that was not started by the test
#   (Home Assistant, queue) with a WARN log. Service mode ends by EXIT SERVICE, by leaving the page, after 10 min of
#   no test (`gp_service_session`) or by a reboot; each end stops the group.
# - While service mode is on `gp.inhibit` makes the gp layer refuse every start except the test's own (source: service),
#   so Home Assistant zone switches, the "Greenhouse irrigation" main switch and gp actions cannot open a valve.
# - Only gp.run_zone (source: service, so the history can tell tests from waterings) / gp.stop_all on gp_greenhouse;
#   never a raw relay or a zone switch. A bed locked by the watchdog is refused by gp.run_zone (its row shows "locked").
# Needs gh_gp, the beds 1-3 and lvgl_page_setup (the SERVICE tile). Tokens only; ASCII only.

substitutions:
  valve_test_max_time: 10s

globals:
  - id: gp_service_mode
    type: bool
    initial_value: "false"
    restore_value: false
  # revision of the gp read model at the last row update
  - id: gp_vt_seen
    type: uint32_t
    initial_value: "0"
    restore_value: false

script:
  - id: gp_service_enter
    mode: restart
    then:
      - gp.stop_all: {id: gp_greenhouse, clear_queue: true}
      # gp starts other than the test's own (source: service) are refused from here on (main switch: see header)
      - gp.inhibit: {id: gp_greenhouse, state: true}
      - globals.set:
          id: gp_service_mode
          value: "true"
      - script.execute: gp_service_session

  # Starts bed `valve` (0-based) for at most valve_test_max_time. Refused outside service mode.
  - id: gp_valve_test_start
    mode: restart
    parameters:
      valve: int
    then:
      - if:
          condition:
            lambda: "return id(gp_service_mode);"
          then:
            - gp.stop_all: gp_greenhouse
            # The guard starts before the valve opens, so the open time can only be shorter than the limit.
            - script.execute: gp_valve_test_guard
            - gp.run_zone:
                id: gp_greenhouse
                zone: !lambda "return valve;"
                duration: ${valve_test_max_time}
                source: service
            - script.execute: gp_service_session

  # Header clock: one action on the shared poller (packages/lvgl/base.yaml).
  - id: !extend gp_header_clock_update
    then:
      - lvgl.label.update:
          id: valve_test_clock_label
          text: !lambda "return id(gp_header_clock_text);"

  # Second, independent enforcement of the limit.
  - id: gp_valve_test_guard
    mode: restart
    then:
      - delay: ${valve_test_max_time}
      - gp.stop_all: gp_greenhouse

  - id: gp_valve_test_stop
    mode: restart
    then:
      - script.stop: gp_valve_test_guard
      - gp.stop_all: gp_greenhouse

  - id: gp_service_session
    mode: restart
    then:
      - delay: 10min
      - script.execute: gp_service_exit

  - id: gp_service_exit
    mode: restart
    then:
      - script.stop: gp_valve_test_guard
      - script.stop: gp_service_session
      - gp.stop_all: gp_greenhouse
      - gp.inhibit: {id: gp_greenhouse, state: false}
      - globals.set:
          id: gp_service_mode
          value: "false"
      - lvgl.page.show: setup_page

  # Leaving the page by any other route (e.g. the sim SIM button) ends service mode too, without navigating.
  - id: gp_service_leave
    mode: restart
    then:
      - script.stop: gp_valve_test_guard
      - script.stop: gp_service_session
      - gp.stop_all: gp_greenhouse
      - gp.inhibit: {id: gp_greenhouse, state: false}
      - globals.set:
          id: gp_service_mode
          value: "false"

interval:
  - interval: 1s
    then:
      # Block other watering while in service mode (anything not started by the test, i.e. guard not running).
      - if:
          condition:
            and:
              - lambda: "return id(gp_service_mode);"
              - lambda: "return id(gp_greenhouse)->summary().running || id(gp_greenhouse)->summary().queue_length > 0;"
              - not:
                  script.is_running: gp_valve_test_guard
          then:
            - logger.log:
                level: WARN
                tag: gp_service
                format: "service mode: external start blocked"
            - gp.stop_all: {id: gp_greenhouse, clear_queue: true}
      - if:
          condition:
            lambda: "return id(gp_greenhouse)->changed_since(id(gp_vt_seen));"
          then:
            - lvgl.label.update:
                id: valve_test_bed1_status
                text: !lambda "return gp::fmt::valve_test_row(id(gp_greenhouse)->zone(0));"
                text_color: !lambda "return lv_color_hex(gp::fmt::valve_test_color(id(gp_greenhouse)->zone(0)));"
            - lvgl.label.update:
                id: valve_test_bed2_status
                text: !lambda "return gp::fmt::valve_test_row(id(gp_greenhouse)->zone(1));"
                text_color: !lambda "return lv_color_hex(gp::fmt::valve_test_color(id(gp_greenhouse)->zone(1)));"
            - lvgl.label.update:
                id: valve_test_bed3_status
                text: !lambda "return gp::fmt::valve_test_row(id(gp_greenhouse)->zone(2));"
                text_color: !lambda "return lv_color_hex(gp::fmt::valve_test_color(id(gp_greenhouse)->zone(2)));"

