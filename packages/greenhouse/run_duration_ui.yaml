# Sync LVGL spinboxes with sprinkler run_duration_number (flash + HA values in number state).
# Call from Home→Greenhouse and esphome on_boot — not from number on_value (unsafe for LVGL; can crash on boot).

script:
  - id: gh_sync_dur_spins
    mode: single
    then:
      - lvgl.spinbox.update:
          id: gh_lvgl_bed1_dur_spin
          value: !lambda return id(gh_bed1_run_duration).state;
      - lvgl.spinbox.update:
          id: gh_lvgl_bed2_dur_spin
          value: !lambda return id(gh_bed2_run_duration).state;
      - lvgl.spinbox.update:
          id: gh_lvgl_bed3_dur_spin
          value: !lambda return id(gh_bed3_run_duration).state;
