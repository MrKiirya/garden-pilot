# Greenhouse hardware names. DHT is interim (breadboard test wiring);
# add I2C air sensor later and remove DHT package include.

substitutions:
  # Interim single-wire DHT11 data pin (breadboard test).
  # Replace with I2C (e.g. AHT20) in sensors_air_i2c.yaml when ready.
  gh_dht_pin: GPIO4

  # Three bed zone valves (relay GPIOs). Adjust for T-Relay / wiring (avoid SPI/touch pins).
  gh_valve_zone1_pin: GPIO21
  gh_valve_zone2_pin: GPIO47
  gh_valve_zone3_pin: GPIO48

  # Soil moisture module (AO = analog, DO = comparator after on-board pot). Change pins if needed.
  gh_soil_ao_pin: GPIO6
  gh_soil_do_pin: GPIO7
  # AO calibration (Volts): dry probe vs wet probe — read old "raw" in logs/HA once, then set here.
  # Typical FC-28 on 3V3: dry ~higher V, wet ~lower V. Tune until 0% = dry, 100% = soaked.
  gh_soil_cal_dry_v: "3.16"
  gh_soil_cal_wet_v: "0.80"
