# Greenhouse schedule screens (design D08 list + D09 editor), the "Schedule" page of the WATER nav slot.
# Needs packages/lvgl/page_schedules.yaml (the page this extends) and packages/greenhouse/schedule.yaml (hub
# gh_schedule)
# plus its slots; also writes the Home "NEXT" label (gh_home_next_label) from the schedule.
#
# List: one card per slot (the hub's first 4 slots in include order; slots 5-8 are Home Assistant only): start time,
# group +
# beds, days + run time, a coloured status word and a chevron. A tap opens the editor `gh_sched_edit_page` (Schedule N):
# ON switch, hour and minute with -/+, seven day buttons, the bed buttons of the group, the RUN TIME factor, CANCEL
# / SAVE.
# The editor edits a RAM draft in the hub; only SAVE writes the changed slot entities (the ones Home Assistant
# edits), so a
# tap never writes flash. LVGL is touched only by the click handlers and by a 1 s poller guarded by the hub's
# `changed_since` (never from a hub trigger). The texts come from the pure helpers of the schedule component
# (components/garden_schedule/schedule_ui.h), so every lambda is one line.
#
# One row, one toggle button and their refresh scripts are the small includes lvgl_schedules_row*.yaml /
# lvgl_schedules_toggle*.yaml (an `!include` with vars works as an item of `widgets:` and of `script:`).
# The zone run durations of the captions are read from the gp read model once at boot (the hub never depends on gp).

esphome:
  on_boot:
    - priority: 600
      then:
        - lambda: "id(gh_schedule)->set_zone_seconds([](size_t z) { return id(gp_greenhouse)->zone(z).run_duration; });"

lvgl:
  pages:
    - id: !extend schedules_page
      widgets:
        # summary line: the next run of any slot and the time to it
        - label:
            x: 8
            y: 30  # same baseline as the 12 px labels (27 + 15 - 3 = 30 + 11 - 2)
            text: "NEXT"
            text_font: montserrat_10
            text_color: 0x78dc77
        - label:
            id: gh_sched_sum_label
            x: 46
            y: 27
            width: 164
            long_mode: DOT
            text: ""
            text_font: montserrat_12
            text_color: 0xe5e2e1
        - label:
            id: gh_sched_sum_in
            x: 212
            y: 27
            width: 100
            text_align: RIGHT
            text: ""
            text_font: montserrat_12
            text_color: 0x78dc77
        - !include
          file: lvgl_schedules_row.yaml
          vars: {n: "1", i: "0", y: "44"}
        - !include
          file: lvgl_schedules_row.yaml
          vars: {n: "2", i: "1", y: "82"}
        - !include
          file: lvgl_schedules_row.yaml
          vars: {n: "3", i: "2", y: "120"}
        - !include
          file: lvgl_schedules_row.yaml
          vars: {n: "4", i: "3", y: "158"}
    - id: gh_sched_edit_page
      bg_color: 0x131313
      bg_opa: COVER
      border_width: 1
      border_color: 0x3f4a3c
      border_side: [TOP, BOTTOM, LEFT, RIGHT]
      scrollable: false
      widgets:
        - label:
            id: gh_sed_title
            x: 8
            y: 4
            text: "Schedule"
            text_font: montserrat_12
            text_color: 0xe5e2e1
        - label:
            id: gh_sed_clock_label
            align: TOP_RIGHT
            x: -8
            y: 4
            text: "--:--"
            text_font: montserrat_12
            text_color: 0xe5e2e1
        - obj:
            x: 0
            y: 22
            width: 320
            height: 1
            bg_color: 0x3f4a3c
            bg_opa: COVER
            border_width: 0
            pad_all: 0
            scrollable: false
            clickable: false
        # ON / OFF: the label is only drawn; the whole 56 x 22 area (x 196..252) is the tap target, the pill is only
        # drawn
        - label:
            id: gh_sed_on_label
            x: 200
            y: 6
            text: "OFF"
            text_font: montserrat_10
            text_color: 0xbecab9
        - button:
            id: gh_sed_btn_enable
            x: 196
            y: 0
            width: 56
            height: 22
            bg_opa: TRANSP
            border_width: 0
            shadow_width: 0
            pad_all: 0
            scrollable: false
            on_click:
              - lambda: "id(gh_schedule)->draft().toggle_enabled();"
              - script.execute: gh_sed_refresh
            widgets:
              - switch:
                  id: gh_sed_switch
                  align: CENTER
                  width: 28
                  height: 14
                  clickable: false
                  bg_color: 0x353534
                  bg_opa: COVER
                  border_width: 0
                  radius: 7
                  indicator:
                    bg_opa: TRANSP
                    checked:
                      bg_color: 0x4caf50
                      bg_opa: COVER
                  knob:
                    bg_color: 0xe5e2e1
                    bg_opa: COVER
        - label:
            x: 44
            y: 28
            width: 68
            text_align: CENTER
            text: "HOUR"
            text_font: montserrat_10
            text_color: 0xbecab9
        - label:
            x: 208
            y: 28
            width: 68
            text_align: CENTER
            text: "MINUTE"
            text_font: montserrat_10
            text_color: 0xbecab9
        - button:
            id: gh_sed_btn_hour_dec
            x: 8
            y: 40
            width: 36
            height: 26
            bg_color: 0x131313
            bg_opa: COVER
            border_width: 1
            border_color: 0xbecab9
            radius: 3
            shadow_width: 0
            pad_all: 0
            scrollable: false
            on_click:
              - lambda: "id(gh_schedule)->draft().hour_down();"
              - script.execute: gh_sed_refresh
            on_long_press:
              - lambda: "id(gh_schedule)->draft().hour_down();"
              - script.execute: gh_sed_refresh
            on_long_press_repeat:
              - lambda: "id(gh_schedule)->draft().hour_down();"
              - script.execute: gh_sed_refresh
            widgets:
              - label:
                  align: CENTER
                  text: "-"
