# Greenhouse irrigation controller: the stock `sprinkler` entry gh_sprinkler (main switch, auto advance).
# Gravity-fed bed zones from a shared barrel, no master/pump switch (self-drain barrel line).
# The valves come from packages/greenhouse/bed.yaml (one include per bed, !extend gh_sprinkler; include this file
# first). The raw relay drivers (board_relay_N) live in the board profile under hardware/.
# Do not call lvgl.* from run_duration_number on_value — restore/HA can fire outside LVGL-safe context and crash.
# Greenhouse page shows run durations as text only (no LVGL spinbox ↔ number sync).

sprinkler:
  - id: gh_sprinkler
    main_switch:
      id: gh_sprinkler_main_switch
      name: "Greenhouse irrigation"
      icon: mdi:water-pump
      on_turn_on:
        - logger.log:
            level: INFO
            tag: gh_sprinkler_main
            format: "Greenhouse irrigation main: ON"
      on_turn_off:
        - logger.log:
            level: INFO
            tag: gh_sprinkler_main
            format: "Greenhouse irrigation main: OFF"
    auto_advance_switch: "Greenhouse auto advance"
