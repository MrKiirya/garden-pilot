# Poll the garden_zones group gh_zones + run duration numbers for LVGL (the group has no text_sensor; use C++ API).
# Names kept from the stock-sprinkler days (file and package key gh_sprinkler_lvgl); a rename is a follow-up.

interval:
  - interval: 1s
    then:
      - lvgl.label.update:
          id: gh_greenhouse_irr_main
          text: !lambda |-
            auto *g = id(gh_zones);
            char buf[56];
            if (g->watchdog_tripped())
              return std::string("Watchdog: locked");
            auto az = g->active_zones();
            if (!az.empty()) {
              size_t n = snprintf(buf, sizeof(buf), "Running:");
              for (size_t zone : az) {
                if (n < sizeof(buf))
                  n += snprintf(buf + n, sizeof(buf) - n, " B%u", (unsigned) (zone + 1));
              }
              return std::string(buf);
            }
            return std::string("Irrigation: idle");
      - lvgl.label.update:
          id: gh_greenhouse_irr_modes
          text: !lambda |-
            auto *g = id(gh_zones);
            char buf[48];
            snprintf(buf, sizeof(buf), "AA:%s  Q:%u", g->auto_advance() ? "on" : "off",
                     (unsigned) g->queued_zones().size());
            return std::string(buf);
      - lvgl.label.update:
          id: gh_greenhouse_run_dur_hint
          text: !lambda |-
            char buf[64];
            if (!id(gh_bed1_run_duration).has_state() || !id(gh_bed2_run_duration).has_state() ||
                !id(gh_bed3_run_duration).has_state()) {
              snprintf(buf, sizeof(buf), "Dur: B1 --  B2 --  B3 --");
            } else {
              snprintf(buf, sizeof(buf), "Dur: B1 %.0f  B2 %.0f  B3 %.0f min",
                       id(gh_bed1_run_duration).state, id(gh_bed2_run_duration).state,
                       id(gh_bed3_run_duration).state);
            }
            return std::string(buf);
      - lvgl.label.update:
          id: gh_greenhouse_t_left_zone
          text: !lambda |-
            auto *g = id(gh_zones);
            char buf[36];
            optional<uint32_t> tr;
            for (size_t zone : g->active_zones()) {
              auto left = g->time_remaining_zone(zone);
              if (left.has_value() && (!tr.has_value() || left.value() < tr.value()))
                tr = left;
            }
            if (!tr.has_value()) {
              snprintf(buf, sizeof(buf), "Zone left: --:--:--");
            } else {
              uint32_t t = tr.value();
              unsigned h = (unsigned) (t / 3600U);
              unsigned m = (unsigned) ((t % 3600U) / 60U);
              unsigned sec = (unsigned) (t % 60U);
              snprintf(buf, sizeof(buf), "Zone left: %02u:%02u:%02u", h, m, sec);
            }
            return std::string(buf);
      - lvgl.label.update:
          id: gh_greenhouse_t_left_total
          text: !lambda |-
            auto *g = id(gh_zones);
            char buf[36];
            auto tr = g->time_remaining();
            if (!tr.has_value()) {
              snprintf(buf, sizeof(buf), "Total left: --:--:--");
            } else {
              uint32_t t = tr.value();
              unsigned h = (unsigned) (t / 3600U);
              unsigned m = (unsigned) ((t % 3600U) / 60U);
              unsigned sec = (unsigned) (t % 60U);
              snprintf(buf, sizeof(buf), "Total left: %02u:%02u:%02u", h, m, sec);
            }
            return std::string(buf);
      - lvgl.label.update:
          id: gh_greenhouse_queue_hint
          text: !lambda |-
            auto *g = id(gh_zones);
            char buf[56];
            uint32_t qt = g->queue_time();
            auto queued = g->queued_zones();
            if (qt == 0 && queued.empty()) {
              snprintf(buf, sizeof(buf), "Queue: (empty)");
            } else {
              unsigned h = (unsigned) (qt / 3600U);
              unsigned m = (unsigned) ((qt % 3600U) / 60U);
              unsigned sec = (unsigned) (qt % 60U);
              if (!queued.empty()) {
                snprintf(buf, sizeof(buf), "Queue: %02u:%02u:%02u next B%u", h, m, sec,
                         (unsigned) queued.front() + 1);
              } else {
                snprintf(buf, sizeof(buf), "Queue: %02u:%02u:%02u", h, m, sec);
              }
            }
            return std::string(buf);
      - lvgl.label.update:
          id: gh_home_irr_status
          text: !lambda |-
            auto *g = id(gh_zones);
            if (g->watchdog_tripped())
              return std::string("Alarm");
            if (!g->active_zones().empty())
              return std::string("Watering");
            return std::string("Idle");
      - lvgl.label.update:
          id: gh_home_next_label
          text: !lambda |-
            auto *g = id(gh_zones);
            char buf[16];
            uint32_t qt = g->queue_time();
            if (qt == 0 && g->queued_zones().empty())
              return std::string("--:--");
            unsigned m = (unsigned) ((qt % 3600U) / 60U);
            unsigned sec = (unsigned) (qt % 60U);
            snprintf(buf, sizeof(buf), "%02u:%02u", m, sec);
            return std::string(buf);
