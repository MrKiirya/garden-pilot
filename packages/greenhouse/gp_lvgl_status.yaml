# Greenhouse labels from the gp_* read model (components/gp/README.md): the greenhouse page and the Home card. Needs
# gh_gp (group gp_greenhouse), gh_lvgl_page and lvgl_page_home, plus core_api for the Home Assistant icon.
# A 1 s poller (LVGL is never updated from a gp callback or trigger: they can fire before
# LVGL is ready). The label texts
# come from gp::fmt (components/gp/format.h), so every lambda is one line. The labels are only redrawn when the model's
# revision changed since the previous poll.

globals:
  - id: gp_gh_seen
    type: uint32_t
    initial_value: "0"
    restore_value: false

interval:
  - interval: 1s
    then:
      - if:
          condition:
            lambda: "return id(gp_greenhouse)->changed_since(id(gp_gh_seen));"
          then:
            - lvgl.label.update:
                id: gh_greenhouse_irr_main
                text: !lambda "return gp::fmt::status_line(id(gp_greenhouse)->summary());"
            - lvgl.label.update:
                id: gh_greenhouse_irr_modes
                text: !lambda "return gp::fmt::modes_line(id(gp_greenhouse)->summary());"
            - lvgl.label.update:
                id: gh_greenhouse_run_dur_hint
                text: !lambda "return gp::fmt::durations_line(id(gp_greenhouse)->model());"
            - lvgl.label.update:
                id: gh_greenhouse_t_left_zone
                text: !lambda "return gp::fmt::zone_left_line(id(gp_greenhouse)->summary());"
            - lvgl.label.update:
                id: gh_greenhouse_t_left_total
                text: !lambda "return gp::fmt::total_left_line(id(gp_greenhouse)->summary());"
            - lvgl.label.update:
                id: gh_greenhouse_queue_hint
                text: !lambda "return gp::fmt::queue_line(id(gp_greenhouse)->summary());"
            - lvgl.label.update:
                id: gh_home_irr_status
                text: !lambda "return gp::fmt::home_status(id(gp_greenhouse)->summary());"
            - lvgl.label.update:
                id: gh_home_next_label
                text: !lambda "return gp::fmt::home_next(id(gp_greenhouse)->summary());"
      # Quiet header icon on Home while no Home Assistant client is connected (not an alert).
      - if:
          condition:
            lambda: "return !api::global_api_server->is_connected();"
          then:
            - lvgl.widget.show: home_ha_icon
          else:
            - lvgl.widget.hide: home_ha_icon
