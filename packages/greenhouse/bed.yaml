# One greenhouse bed: a `garden_zone:` list item of the group gh_zones with its enable switch and run-duration number.
# Include it once per bed from the entry file (vars are all required, literal strings):
#
#   gh_bed_1: !include
#     file: packages/greenhouse/bed.yaml
#     vars: {bed: "1", bed_name: "Greenhouse bed 1", relay: "1"}
#
#   bed        bed number; used in ids (gh_bed<bed>_run_duration). Unique per bed.
#   bed_name   entity name in Home Assistant; "<bed_name> enable" and "<bed_name> run duration" derive from it.
#   relay      board relay number; the bed drives `board_relay_<relay>` from the hardware profile.
#
# Requirements and rules:
# - Include packages/greenhouse/irrigation.yaml (gh_irrigation) BEFORE the beds: it declares the group gh_zones.
# - The order of the bed blocks in the entry file is the zone order (zone_number 0, 1, 2, ... used by the greenhouse
#   page).
# - One bed is enough (headless; the greenhouse page still expects beds 1-3 until roadmap stage 9).
# - The run-duration number max (gh_bed_run_max, minutes) must fit under the watchdog limit gh_max_on_time, see
#   packages/greenhouse/irrigation.yaml. A restored value above the max is clamped at boot.
# - Optional soil moisture sensor for the bed: packages/greenhouse/bed_soil.yaml (separate include, reports only).
# - Do not call lvgl.* from run_duration_number on_value (restore/HA can fire outside an LVGL-safe context).

garden_zone:
  - group: gh_zones
    valve_switch: "${bed_name}"
    enable_switch: "${bed_name} enable"
    run_duration_number:
      id: gh_bed${bed}_run_duration
      name: "${bed_name} run duration"
      initial_value: ${gh_bed_run_initial}
      min_value: 1
      max_value: ${gh_bed_run_max}
      step: 1
      unit_of_measurement: "min"
      restore_value: true
      icon: mdi:timer-outline
      mode: BOX
    valve_switch_id: board_relay_${relay}
