# Full-screen greenhouse page (beds + air + soil + irrigation).
# Run durations are shown as text from number entities (HA); do not sync LVGL spinboxes — wrong ranges overwrite HA.

lvgl:
  pages:
    - id: greenhouse_page
      widgets:
        - label:
            x: 10
            y: 8
            text: "Greenhouse"
        - label:
            id: gh_greenhouse_t_label
            x: 10
            y: 26
            text: "Air: -- C"
        - label:
            id: gh_greenhouse_rh_label
            x: 140
            y: 26
            text: "RH: -- %"
        - label:
            id: gh_greenhouse_irr_main
            x: 10
            y: 44
            text: "Irrigation: idle"
        - label:
            id: gh_greenhouse_irr_modes
            x: 10
            y: 58
            text: "AA:off  Q:off  Rev:off"
        - label:
            id: gh_greenhouse_run_dur_hint
            x: 10
            y: 72
            text: "Dur: B1 -- B2 -- B3 --"
        - label:
            id: gh_greenhouse_t_left_zone
            x: 10
            y: 86
            text: "Zone left: --:--:--"
        - label:
            id: gh_greenhouse_t_left_total
            x: 10
            y: 100
            text: "Total left: --:--:--"
        - label:
            id: gh_greenhouse_queue_hint
            x: 10
            y: 114
            text: "Queue: (empty)"
        - label:
            id: gh_greenhouse_soil_hint
            x: 10
            y: 128
            text: "Soil: --"
        - button:
            id: gh_btn_run_bed1
            x: 10
            y: 146
            width: 92
            height: 30
            on_click:
              - sprinkler.start_single_valve:
                  id: gh_sprinkler
                  valve_number: 0
            widgets:
              - label:
                  align: CENTER
                  text: "Bed 1"
        - button:
            id: gh_btn_run_bed2
            x: 114
            y: 146
            width: 92
            height: 30
            on_click:
              - sprinkler.start_single_valve:
                  id: gh_sprinkler
                  valve_number: 1
            widgets:
              - label:
                  align: CENTER
                  text: "Bed 2"
        - button:
            id: gh_btn_run_bed3
            x: 218
            y: 146
            width: 92
            height: 30
            on_click:
              - sprinkler.start_single_valve:
                  id: gh_sprinkler
                  valve_number: 2
            widgets:
              - label:
                  align: CENTER
                  text: "Bed 3"
        - button:
            id: gh_btn_queue_bed1
            x: 10
            y: 180
            width: 92
            height: 28
            on_click:
              - sprinkler.queue_valve:
                  id: gh_sprinkler
                  valve_number: 0
            widgets:
              - label:
                  align: CENTER
                  text: "+Q B1"
        - button:
            id: gh_btn_queue_bed2
            x: 114
            y: 180
            width: 92
            height: 28
            on_click:
              - sprinkler.queue_valve:
                  id: gh_sprinkler
                  valve_number: 1
            widgets:
              - label:
                  align: CENTER
                  text: "+Q B2"
        - button:
            id: gh_btn_queue_bed3
            x: 218
            y: 180
            width: 92
            height: 28
            on_click:
              - sprinkler.queue_valve:
                  id: gh_sprinkler
                  valve_number: 2
            widgets:
              - label:
                  align: CENTER
                  text: "+Q B3"
        - button:
            id: gh_btn_stop
            x: 10
            y: 212
            width: 92
            height: 28
            on_click:
              - sprinkler.shutdown: gh_sprinkler
            widgets:
              - label:
                  align: CENTER
                  text: "Stop"
        - button:
            id: gh_btn_start_queue
            x: 114
            y: 212
            width: 92
            height: 28
            on_click:
              - sprinkler.start_from_queue:
                  id: gh_sprinkler
            widgets:
              - label:
                  align: CENTER
                  text: "Run Q"
        - button:
            id: gh_btn_home
            x: 218
            y: 212
            width: 92
            height: 28
            on_click:
              - lvgl.page.show: home_page
            widgets:
              - label:
                  align: CENTER
                  text: "Home"
