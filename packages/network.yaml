# Home Assistant / ESPHome Dashboard (native API).
api:
  encryption:
    key: !secret api_encryption_key

# Wireless firmware updates.
ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2

  # Fallback AP when station WiFi fails; password from secrets.
  ap:
    ssid: "GardenPilot-AP"
    password: !secret wifi_ap_password

captive_portal:

# Wall clock for LVGL header (Home Assistant sets local time when API is connected).
time:
  - platform: homeassistant
    id: ha_time
    on_time_sync:
      - lvgl.label.update:
          id: home_clock_label
          text:
            time_format: "%H:%M"
            time: ha_time

interval:
  - interval: 30s
    then:
      - lvgl.label.update:
          id: home_clock_label
          text:
            time_format: "%H:%M"
            time: ha_time
