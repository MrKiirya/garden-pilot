# Setup page (draft D10): 2x3 tile grid. NETWORK opens the Network page, DISPLAY opens the touch test, TIME shows the
# clock, SERVICE opens the valve test, the other tiles are "Soon" placeholders. Bottom nav copies the
# Home nav with SETUP active; widget ids are global, hence the setup_nav_btn_* prefix.
# Tokens only (design/tokens.json); ASCII only (built-in fonts). The 1 s poller below updates NETWORK and TIME
# (pollers, not on_value: LVGL may not be ready then). Needs core_time (ha_time) and page_network.

lvgl:
  pages:
    - id: setup_page
      bg_color: 0x131313
      bg_opa: COVER
      border_width: 1
      border_color: 0x3f4a3c
      border_side: [TOP, BOTTOM, LEFT, RIGHT]
      scrollable: false
      widgets:
        - label:
            x: 8
            y: 4
            text: "Setup"
            text_font: montserrat_12
            text_color: 0xe5e2e1
        - label:
            id: setup_clock_label
            align: TOP_RIGHT
            x: -8
            y: 4
            text: "--:--"
            text_font: montserrat_12
            text_color: 0xe5e2e1
        - obj:
            x: 0
            y: 22
            width: 320
            height: 1
            bg_color: 0x3f4a3c
            bg_opa: COVER
            border_width: 0
            pad_all: 0
            scrollable: false
            clickable: false
        - button:
            id: setup_tile_network
            x: 8
            y: 26
            width: 150
            height: 52
            bg_color: 0x1c1b1b
            bg_opa: COVER
            border_width: 1
            border_color: 0x3f4a3c
            radius: 2
            pad_all: 0
            shadow_width: 0
            scrollable: false
            on_click:
              - lvgl.page.show: network_page
            widgets:
              - label:
                  x: 6
                  y: 6
                  text: "NETWORK"
                  text_font: montserrat_10
                  text_color: 0xbecab9
              - label:
                  id: setup_network_value
                  x: 6
                  y: 20
                  text: "HA offline"
                  text_font: montserrat_12
                  text_color: 0xbecab9
              - label:
                  x: 132
                  y: 20
                  text: "\uF054"
                  text_font: montserrat_12
                  text_color: 0xbecab9
        - obj:
            id: setup_tile_time
            x: 162
            y: 26
            width: 150
            height: 52
            bg_color: 0x1c1b1b
            bg_opa: COVER
            border_width: 1
            border_color: 0x3f4a3c
            radius: 2
            pad_all: 0
            shadow_width: 0
            scrollable: false
            clickable: false
            widgets:
              - label:
                  x: 6
                  y: 6
                  text: "TIME"
                  text_font: montserrat_10
                  text_color: 0xbecab9
              - label:
                  id: setup_time_value
                  x: 6
                  y: 20
                  text: "--:-- not set"
                  text_font: montserrat_12
                  text_color: 0xbecab9
        - button:
            id: setup_tile_display
            x: 8
            y: 82
            width: 150
            height: 52
            bg_color: 0x1c1b1b
            bg_opa: COVER
            border_width: 1
            border_color: 0x3f4a3c
            radius: 2
            pad_all: 0
            shadow_width: 0
            scrollable: false
            on_click:
              - lvgl.page.show: touch_test_page
            widgets:
              - label:
                  x: 6
                  y: 6
                  text: "DISPLAY"
                  text_font: montserrat_10
                  text_color: 0xbecab9
              - label:
                  id: setup_display_value
                  x: 6
                  y: 20
                  text: "Touch test"
                  text_font: montserrat_12
                  text_color: 0xe5e2e1
              - label:
                  x: 132
                  y: 20
                  text: "\uF054"
                  text_font: montserrat_12
                  text_color: 0xbecab9
        - obj:
            id: setup_tile_cycle
            x: 162
            y: 82
            width: 150
            height: 52
            bg_color: 0x1c1b1b
            bg_opa: COVER
            border_width: 1
            border_color: 0x3f4a3c
            radius: 2
            pad_all: 0
            shadow_width: 0
            scrollable: false
            clickable: false
            widgets:
              - label:
                  x: 6
                  y: 6
                  text: "CYCLE"
                  text_font: montserrat_10
                  text_color: 0xbecab9
              - label:
                  id: setup_cycle_value
                  x: 6
                  y: 20
                  text: "Soon"
                  text_font: montserrat_12
                  text_color: 0xbecab9
        - obj:
            id: setup_tile_sensors
            x: 8
            y: 138
            width: 150
            height: 52
            bg_color: 0x1c1b1b
            bg_opa: COVER
            border_width: 1
            border_color: 0x3f4a3c
            radius: 2
            pad_all: 0
            shadow_width: 0
            scrollable: false
            clickable: false
            widgets:
              - label:
                  x: 6
                  y: 6
                  text: "SENSORS"
                  text_font: montserrat_10
                  text_color: 0xbecab9
              - label:
                  id: setup_sensors_value
                  x: 6
                  y: 20
                  text: "Soon"
                  text_font: montserrat_12
                  text_color: 0xbecab9
        # SERVICE opens the valve test (packages/greenhouse/lvgl_valve_test.yaml). That page is a greenhouse package,
        # so this tile needs it: fine while the greenhouse is the only zone group (both entry files include it).
        - button:
            id: setup_tile_service
            x: 162
            y: 138
            width: 150
            height: 52
            bg_color: 0x1c1b1b
            bg_opa: COVER
            border_width: 1
            border_color: 0x3f4a3c
            radius: 2
            pad_all: 0
            shadow_width: 0
            scrollable: false
            on_click:
              - lvgl.page.show: valve_test_page
            widgets:
              - label:
                  x: 6
                  y: 6
                  text: "SERVICE"
                  text_font: montserrat_10
                  text_color: 0xbecab9
              - label:
                  id: setup_service_value
                  x: 6
                  y: 20
                  text: "Valve test"
                  text_font: montserrat_12
                  text_color: 0xffb870
              - label:
                  x: 132
                  y: 20
                  text: "\uF054"
                  text_font: montserrat_12
                  text_color: 0xbecab9

        # --- Bottom nav: shared component (packages/lvgl/nav_bar.yaml) ---
        - !include
          file: nav_bar.yaml
          vars: {p: setup_, active: setup}

interval:
  - interval: 1s
    then:
      - if:
          condition:
            api.connected:
          then:
            - lvgl.label.update:
                id: setup_network_value
                text: "HA online"
                text_color: 0x78dc77
          else:
            - lvgl.label.update:
                id: setup_network_value
                text: "HA offline"
                text_color: 0xbecab9
      - if:
          condition:
            lambda: "return id(ha_time).now().is_valid();"
          then:
            - lvgl.label.update:
                id: setup_time_value
                text: !lambda "return id(gp_header_clock_text);"
                text_color: 0xe5e2e1
          else:
            - lvgl.label.update:
                id: setup_time_value
                text: "--:-- not set"
                text_color: 0xbecab9

# Header clock: one action on the shared poller (packages/lvgl/base.yaml).
script:
  - id: !extend gp_header_clock_update
    then:
      - lvgl.label.update:
          id: setup_clock_label
          text: !lambda "return id(gp_header_clock_text);"
