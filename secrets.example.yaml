# Copy to secrets.yaml and replace all values. Do not commit secrets.yaml (see .gitignore).

# WiFi (station mode)
wifi_ssid: "0000000000000000"
wifi_password: "00000000000000000000000000000000"

# Captive portal / WiFi fallback AP password (when the device opens its own AP).
wifi_ap_password: "00000000000000000000000000000000"

# Home Assistant native API encryption: base64 of the ASCII text "garden-pilot-example-key-dummy!!" (placeholder only;
# ESPHome rejects an all-zeros key). Generate a real one: openssl rand -base64 32
api_encryption_key: "Z2FyZGVuLXBpbG90LWV4YW1wbGUta2V5LWR1bW15ISE="

# OTA / wireless upload password
ota_password: "00000000000000000000000000000000"

# PC emulator (garden-pilot-sim.yaml) API key: public dummy, emulator only. It is base64 of the ASCII text
# "garden-pilot-sim-public-dummy!!!"; anyone who can reach the emulator's port can toggle its simulated entities
# (nothing physical). Never reuse a device key here.
sim_api_encryption_key: "Z2FyZGVuLXBpbG90LXNpbS1wdWJsaWMtZHVtbXkhISE="
